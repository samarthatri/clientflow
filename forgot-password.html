
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClientFlow | Forgot Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container min-vh-100 d-flex justify-content-center align-items-center">
        <div class="card border-0 shadow-sm p-4 w-100" style="max-width: 420px;">
            <h2 class="fw-bold mb-2">Forgot Password?</h2>
            <p class="text-secondary mb-4">
                Enter your registered email to reset your password.
            </p>

            <form id="forgotPasswordForm" novalidate>
                <div class="mb-3">
                    <label for="resetEmail" class="form-label">Email Address</label>
                    <input type="email" id="resetEmail" class="form-control" required>
                    <div class="invalid-feedback">Enter a valid email address.</div>
                </div>

                <div id="resetMessage" class="small mb-3"></div>

                <button type="submit" class="btn btn-primary w-100">
                    Continue
                </button>
            </form>

            <p class="text-center mt-3 mb-0">
                <a href="login.html">Back to Login</a>
            </p>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="auth.js"></script>
</body>
</html>
