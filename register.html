
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClientFlow | Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container min-vh-100 d-flex justify-content-center align-items-center">
        <div class="card border-0 shadow-sm p-4 w-100" style="max-width: 420px;">
            <h2 class="fw-bold mb-1">Create Account</h2>
            <p class="text-secondary mb-4">Join ClientFlow</p>

            <form id="registerForm" novalidate>
                <div class="mb-3">
                    <label for="registerName" class="form-label">Full Name</label>
                    <input type="text" id="registerName" class="form-control" minlength="2" required>
                    <div class="invalid-feedback">Enter at least 2 characters.</div>
                </div>

                <div class="mb-3">
                    <label for="registerEmail" class="form-label">Email</label>
                    <input type="email" id="registerEmail" class="form-control" required>
                    <div class="invalid-feedback">Enter a valid email address.</div>
                </div>

                <div class="mb-3">
                    <label for="registerPassword" class="form-label">Password</label>
                    <input type="password" id="registerPassword" class="form-control" minlength="6" required>
                    <div class="invalid-feedback">Use at least 6 characters.</div>
                </div>

                <div id="registerError" class="text-danger small mb-3"></div>

                <button type="submit" class="btn btn-primary w-100">Create Account</button>
            </form>

            <p class="text-center mt-3 mb-0">
                Already registered? <a href="login.html">Login</a>
            </p>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="auth.js"></script>
</body>
</html>
