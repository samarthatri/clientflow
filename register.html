
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClientFlow | Register</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="style.css">

    <style>
        .register-card {
            max-width: 440px;
            width: 100%;
            padding: 30px !important;
            border: 1px solid #e2e8f0 !important;
            border-radius: 20px !important;
            background: #fff;
            box-shadow: 0 20px 60px rgba(15, 23, 42, 0.08) !important;
        }

        .register-card h2 {
            font-weight: 800;
            letter-spacing: -1px;
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper .form-control {
            padding-right: 48px;
        }

        .password-toggle {
            position: absolute;
            top: 50%;
            right: 12px;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5px;
            border: none;
            background: transparent;
            color: #64748b;
            cursor: pointer;
            z-index: 2;
        }

        .password-toggle:hover {
            color: #4f46e5;
        }

        .register-card .form-control {
            min-height: 46px;
            border-radius: 10px;
        }

        .register-card .btn-primary {
            min-height: 48px;
            border-radius: 10px;
            font-weight: 600;
        }

        #registerError:empty {
            display: none;
        }
    </style>
</head>

<body>
    <main class="container min-vh-100 d-flex justify-content-center align-items-center py-4">
        <div class="card register-card">
            <h2 class="mb-1">Create Account</h2>
            <p class="text-secondary mb-4">Join ClientFlow</p>

            <form id="registerForm" novalidate>
                <div class="mb-3">
                    <label for="registerName" class="form-label">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="registerName"
                        class="form-control"
                        placeholder="Enter your full name"
                        minlength="2"
                        autocomplete="name"
                        required
                    >

                    <div class="invalid-feedback">
                        Enter at least 2 characters.
                    </div>
                </div>

                <div class="mb-3">
                    <label for="registerEmail" class="form-label">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="registerEmail"
                        class="form-control"
                        placeholder="name@example.com"
                        autocomplete="email"
                        required
                    >

                    <div class="invalid-feedback">
                        Enter a valid email address.
                    </div>
                </div>

                <div class="mb-3">
                    <label for="registerPassword" class="form-label">
                        Password
                    </label>

                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="registerPassword"
                            class="form-control"
                            placeholder="Create a password"
                            minlength="8"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            onclick="togglePassword('registerPassword', this)"
                            aria-label="Show password"
                            aria-pressed="false"
                        >
                            <svg xmlns="http://www.w3.org/2000/svg"
                                width="21" height="21" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>

                    <div class="invalid-feedback">
                        Use at least 8 characters.
                    </div>
                </div>

                <div
                    id="registerError"
                    class="text-danger small mb-3"
                    role="alert"
                    aria-live="polite"
                ></div>

                <button type="submit" class="btn btn-primary w-100">
                    Register
                </button>
            </form>

            <p class="text-center mt-4 mb-0">
                Already registered?
                <a href="login.html">Login</a>
            </p>
        </div>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="auth.js"></script>

    <script>
        function togglePassword(inputId, button) {
            const input = document.getElementById(inputId);
            const showing = input.type === "text";

            input.type = showing ? "password" : "text";
            button.setAttribute("aria-pressed", String(!showing));
            button.setAttribute(
                "aria-label",
                showing ? "Show password" : "Hide password"
            );

            button.innerHTML = showing
                ? '<svg xmlns="http://www.w3.org/2000/svg" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>'
                : '<svg xmlns="http://www.w3.org/2000/svg" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.2A11 11 0 0 1 12 5c6.5 0 10 7 10 7a15 15 0 0 1-4 4.7"/><path d="M6.2 6.2A15 15 0 0 0 2 12s3.5 7 10 7a10 10 0 0 0 3-.5"/></svg>';
        }
    </script>
</body>
</html>
