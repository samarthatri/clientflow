
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClientFlow | My Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark px-4">
        <a class="navbar-brand fw-bold" href="index.html">ClientFlow</a>
        <a href="index.html" class="btn btn-outline-light btn-sm">Dashboard</a>
    </nav>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4">
                        <h2 class="mb-1">My Profile</h2>
                        <p class="text-secondary mb-4">View and update your account information.</p>

                        <form id="profileForm" novalidate>
                            <div class="mb-3">
                                <label for="profileName" class="form-label">Full Name</label>
                                <input type="text" id="profileName" class="form-control" minlength="2" required>
                                <div class="invalid-feedback">Enter at least 2 characters.</div>
                            </div>

                            <div class="mb-3">
                                <label for="profileEmail" class="form-label">Email Address</label>
                                <input type="email" id="profileEmail" class="form-control" required>
                                <div class="invalid-feedback">Enter a valid email address.</div>
                            </div>

                            <div class="mb-3">
                                <label for="profileRole" class="form-label">Role</label>
                                <input type="text" id="profileRole" class="form-control" readonly>
                            </div>

                            <div id="profileMessage" class="small mb-3"></div>

                            <button type="submit" class="btn btn-primary w-100">
                                Save Changes
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="auth.js"></script>
</body>
</html>
