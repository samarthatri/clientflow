
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClientFlow | Reset Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container min-vh-100 d-flex justify-content-center align-items-center">
        <div class="card border-0 shadow-sm p-4 w-100" style="max-width: 420px;">
            <h2 class="fw-bold mb-2">Reset Password</h2>
            <p class="text-secondary mb-4">Choose a new password.</p>

            <form id="resetPasswordForm" novalidate>
                <div class="mb-3">
                    <label for="newPassword" class="form-label">New Password</label>
                    <input type="password" id="newPassword" class="form-control" minlength="6" required>
                    <div class="invalid-feedback">Use at least 6 characters.</div>
                </div>

               
<div class="mb-3">
    <label for="newPassword" class="form-label">New Password</label>

    <div class="password-wrapper">
        <input
            type="password"
            id="newPassword"
            class="form-control"
            minlength="6"
            required
        >

        <button
            type="button"
            class="password-toggle"
            onclick="togglePassword('newPassword', this)"
            aria-label="Show password"
        >
            👁
        </button>
    </div>

    <div class="invalid-feedback">Use at least 6 characters.</div>
</div>

                
<div class="mb-3">
    <label for="confirmPassword" class="form-label">Confirm Password</label>

    <div class="password-wrapper">
        <input
            type="password"
            id="confirmPassword"
            class="form-control"
            minlength="6"
            required
        >

        <button
            type="button"
            class="password-toggle"
            onclick="togglePassword('confirmPassword', this)"
            aria-label="Show password"
        >
            👁
        </button>
    </div>

    <div class="invalid-feedback">Use at least 6 characters.</div>
</div>

                <div id="resetPasswordMessage" class="small mb-3"></div>

                <button type="submit" class="btn btn-primary w-100">
                    Reset Password
                </button>
            </form>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="auth.js"></script>
</body>
</html>
