
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClientFlow | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container min-vh-100 d-flex justify-content-center align-items-center">
        <div class="card border-0 shadow-sm p-4 w-100" style="max-width: 420px;">
            <h2 class="fw-bold mb-1">ClientFlow</h2>
            <p class="text-secondary mb-4">Sign in to your account</p>

            <form id="loginForm" novalidate>
                <div class="mb-3">
                    <label for="loginEmail" class="form-label">Email</label>
                    <input type="email" id="loginEmail" class="form-control" required>
                    <div class="invalid-feedback">Enter a valid email address.</div>
                </div>

                <div class="mb-3">
                    <label for="loginPassword" class="form-label">Password</label>
                    <input type="password" id="loginPassword" class="form-control" required minlength="6">
                    <div class="invalid-feedback">Enter a password of at least 6 characters.</div>
                </div>

                <div id="loginError" class="text-danger small mb-3"></div>

                <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>

            <p class="text-center mt-3 mb-0">
                Don't have an account?
                <a href="register.html">Register</a>
            </p>

            <p class="text-center mt-2 mb-0">
                <a href="forgot-password.html">Forgot password?</a>
            </p>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="auth.js"></script>
</body>
</html>
